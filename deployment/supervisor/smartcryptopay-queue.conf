; Laravel queue worker for the database queue on a generic Linux VPS.
; Copy this file to /etc/supervisor/conf.d/smartcryptopay-queue.conf
; then reload Supervisor.

[program:smartcryptopay-queue]
command=/usr/bin/php /var/www/smart-cryptopay/artisan queue:work database --tries=3
directory=/var/www/smart-cryptopay
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
killasgroup=true
stopasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/smartcryptopay-queue.out.log
stderr_logfile=/var/log/supervisor/smartcryptopay-queue.err.log
numprocs=1
process_name=%(program_name)s

; Optional tuning: comment out if not needed in your environment.
; environment=HOME="/var/www/smart-cryptopay"
